<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Lobster Pot - Vehicle Checks</title>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="Vehicle Checks">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" sizes="180x180"
        href="https://just2g0raids-sketch.github.io/vehicle-checks/Icon.png?v=3">
  <link rel="icon" type="image/png"
        href="https://just2g0raids-sketch.github.io/vehicle-checks/Icon.png?v=3">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 28px 20px;
    }

    .logo {
      display: block;
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 18px;
    }

    p {
      font-size: 16px;
      margin: 0 0 30px;
    }

    .open-button {
      display: block;
      width: 100%;
      background: #d9272e;
      color: #ffffff;
      padding: 18px 12px;
      margin-top: 28px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .open-button:active {
      background: #b91f25;
    }
  </style>
</head>

<body>
  <img
    class="logo"
    src="https://just2g0raids-sketch.github.io/vehicle-checks/Icon.png"
    alt="The Lobster Pot truck"
  >

  <h1>THE LOBSTER POT</h1>
  <p>Vehicle Checks</p>

  <a
    class="open-button"
    href="https://script.google.com/macros/s/AKfycbwNzAawyTp1wdXOvzrkLojfquIE9SN9AnQ7qJeRsP1WUuBA0UI1h_8nEtxVci0GYcAx/exec"
  >
    OPEN VEHICLE CHECKS
  </a>
</body>
</html>
